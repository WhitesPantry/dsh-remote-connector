- insert:
    - id: remote-connector
      name: 'dsh-remote-connector'
      config:
        sshBinary: ssh
        connectTimeoutSec: 15
        storageDir: ~/.dsh/dsh-remote-connector
        nodeVersion: v22.21.0
        dshPackage: '@deepseek-ai/dsh'
        defaultRemotePort: 8787
        defaultLocalPort: 8787
        servers: []
